[package]
name = "apply_patch"
version = "1.2.0"
edition = "2021"
authors = ["Bloodborne Demake Team"]
description = "Standalone high-performance reconstructor for Bloodborne: Low-Poly Overhaul"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rayon = "1.10"
memmap2 = "0.9.12"
fs2 = "0.4.3"
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
